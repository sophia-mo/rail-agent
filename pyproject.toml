[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-agent"
version = "0.1.0"
description = "LangChain + Playwright 12306 booking assistant"
requires-python = ">=3.10"
dependencies = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2", "playwright>=1.50,<2", "python-dotenv>=1,<2"]

[project.scripts]
rail-agent = "rail_agent.cli:main"

[tool.setuptools.packages.find]
include = ["rail_agent*"]
